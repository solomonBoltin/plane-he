# Build the Hebrew Plane frontend and publish it where the office can fetch it anonymously.
#
# WHY THIS RUNS HERE AND NOT ON THE OFFICE MACHINE: `apps/web/Dockerfile.web` runs `turbo prune`
# over the whole monorepo, then a pnpm install and a Vite build of the entire web app. The office's
# engine is a 5 GiB Lima guest that is already at its ceiling — CI is where the room is.
#
# WHY arm64: the office runs on Apple Silicon (the Lima guest is aarch64). Building linux/arm64
# with QEMU on an amd64 runner takes hours; GitHub's native arm64 runner takes minutes. Adding
# amd64 later is one matrix entry plus a `docker buildx imagetools create` merge.
#
# TWO ARTIFACTS, on purpose:
#   1. a RELEASE ASSET tarball of the built SPA — public, anonymous, no registry login. This is what
#      `apps/project-pln/Dockerfile` consumes, so a private GHCR package can never break a deploy.
#   2. the image on GHCR — the same bytes, for anyone who prefers to pull an image. It is pushed
#      with the workflow token, so it starts PRIVATE; the last step tries to flip it public and
#      says so loudly if it cannot (that needs one click in the package settings).

name: hebrew-frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "locales/**"
      - "overrides/**"
      - "tools/**"
      - "VERSION"
      - ".github/workflows/build.yml"

permissions:
  contents: write # create the release the office downloads
  packages: write # push the image

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Read the upstream pin
        id: pin
        run: |
          echo "tag=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          # The release tag carries the COMMIT, so every build gets its OWN release and its own
          # asset. A rolling tag means the bytes behind a URL the office has pinned by sha256 change
          # under it on the next push — and the failure lands later, as a checksum mismatch during a
          # container build that has nothing to do with the change that caused it.
          echo "short=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "release=he-$(cat VERSION)-$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Clone upstream at the pin
        run: |
          git clone --depth 1 --branch "${{ steps.pin.outputs.tag }}" \
            https://github.com/makeplane/plane.git upstream

      - name: Apply the Hebrew patch
        run: python3 tools/apply.py upstream

      - name: Hebrew locale must match upstream English key-for-key
        run: python3 tools/check-parity.py upstream/packages/i18n/src/locales/en locales/he

      - name: Build the frontend image
        run: |
          docker build \
            --file upstream/apps/web/Dockerfile.web \
            --tag "plane-frontend-he:${{ steps.pin.outputs.tag }}" \
            upstream

      - name: Extract the built SPA, set the document to Hebrew, and checksum it
        id: spa
        run: |
          # WHERE the static build lives is not stable across upstream versions: the tag this patch
          # is pinned to (v1.4.2) serves it from nginx at /usr/share/nginx/html, while master's
          # Dockerfile.web switched the final stage to Caddy and /usr/share/caddy/html. Probing for
          # it is cheaper than another ten-minute build to discover which one this tag uses — and
          # loud when neither is there, instead of patching a file that does not exist.
          img="plane-frontend-he:${{ steps.pin.outputs.tag }}"
          html_root=$(docker run --rm --entrypoint sh "$img" -c \
            'for d in /usr/share/nginx/html /usr/share/caddy/html; do [ -f "$d/index.html" ] && { echo "$d"; exit 0; }; done; exit 1')
          [ -n "$html_root" ] || { echo "::error::no static web root (nginx or caddy) found in $img"; exit 1; }
          echo "static root in the image: $html_root"
          cid=$(docker create "$img")
          docker cp "$cid:$html_root" web
          docker rm "$cid"
          ls -la web | head -20
          # The document element is the one thing the runtime patch cannot fix BEFORE the first
          # paint — index.html is served as-is and the bundle runs after it. Setting lang/dir here
          # removes the left-to-right flash on every load. The runtime patch still owns it after
          # that, so a user who switches back to English gets LTR immediately.
          python3 tools/set-document-language.py web/index.html he rtl
          asset="plane-web-he-${{ steps.pin.outputs.tag }}.tar.gz"
          tar -czf "$asset" -C web .
          sha=$(sha256sum "$asset" | cut -d' ' -f1)
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "sha256: $sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the SPA as a release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pin.outputs.release }}
          name: Hebrew frontend for Plane ${{ steps.pin.outputs.tag }} (${{ steps.pin.outputs.short }})
          body: |
            Hebrew locale (`he`) + RTL support for Plane ${{ steps.pin.outputs.tag }}, built from
            `makeplane/plane` at that tag with the patch in this repository.

            The tarball is the SPA that upstream's image serves from its static web root
            (`/usr/share/nginx/html` on this tag). It is what `apps/project-pln` consumes:
            `PLANE_HE_WEB_URL` + `PLANE_HE_WEB_SHA256`:
            `https://github.com/${{ github.repository }}/releases/download/${{ steps.pin.outputs.release }}/${{ steps.spa.outputs.asset }}`
          files: ${{ steps.spa.outputs.asset }}

      # Order matters: the RELEASE ASSET above is the artifact the office consumes, and it needs no
      # registry login. GHCR is the convenience copy, so a registry problem must never block the
      # thing that actually deploys.
      - name: Publish the image to GHCR
        continue-on-error: true
        run: |
          # GHCR rejects an UPPERCASE repository path, and `github.repository_owner` preserves the
          # account's casing (`solomonBoltin`) — pushing that verbatim fails with "repository name
          # must be lowercase" and takes the rest of the job with it.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${owner}/plane-frontend:${{ steps.pin.outputs.tag }}-he"
          docker tag "plane-frontend-he:${{ steps.pin.outputs.tag }}" "$image"
          docker push "$image"
          echo "pushed $image"

      - name: Try to make the GHCR package public (anonymous pulls for the office)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH "/user/packages/container/plane-frontend" -f visibility=public \
            || echo "::warning::could not flip the package to public — set it in the package settings (one click), or consume the release asset instead (which needs no login)."
